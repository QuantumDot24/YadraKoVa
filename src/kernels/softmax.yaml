dtypes: [bf16, fp32, fp16]
block: [32, 1, 1]
grid:
  x: rows
shared_mem_bytes: 0

op:
  name: Softmax
  inputs: [input]
  output: output
  scalar_init:
    rows: "input.shape()[0]"
    cols: "input.shape()[1]"
  checks:
    - "input.ndim() == 2"
    - "input.is_contiguous()"
  backends: [CuDNN, Custom]